name: 验证编译

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 授权 Gradle Wrapper
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      - name: 还原签名文件
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fe-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fe-signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fe-signing/release.keystore" >> "$GITHUB_ENV"

      - name: 验证正式版签名构建
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: 验证正式版证书指纹
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "${apk:-}" ] || [ ! -f "$apk" ]; then
            echo "没有找到正式版 APK。" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          certificate_sha256="$($apksigner verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
          if ! [[ "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "无法读取正式版证书 SHA-256。" >&2
            exit 1
          fi
          echo "正式版证书 SHA-256：$certificate_sha256"
          echo "release_certificate_sha256=$certificate_sha256" >> "$GITHUB_OUTPUT"
          echo "## 正式版证书" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256：\`$certificate_sha256\`" >> "$GITHUB_STEP_SUMMARY"
