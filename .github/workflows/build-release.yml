name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fe-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SO_REPO: laststudio/ets_resolver

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download latest resolver/cloud SOs from ets_resolver release
        env:
          SO_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SO_TOKEN}" || { echo "缺少 PUBLIC_RELEASE_TOKEN 用于读取 ets_resolver"; exit 1; }
          mkdir -p app/src/main/jniLibs/arm64-v8a
          rm -f app/src/main/jniLibs/arm64-v8a/libresolver.so app/src/main/jniLibs/arm64-v8a/libcloud.so
          GH_TOKEN="${SO_TOKEN}" gh release download \
            --repo "${SO_REPO}" \
            --pattern 'libresolver.so' \
            --pattern 'libcloud.so' \
            --dir app/src/main/jniLibs/arm64-v8a \
            --clobber
          file app/src/main/jniLibs/arm64-v8a/libresolver.so app/src/main/jniLibs/arm64-v8a/libcloud.so | grep -q 'ELF 64-bit LSB shared object'
          sha256sum app/src/main/jniLibs/arm64-v8a/libresolver.so app/src/main/jniLibs/arm64-v8a/libcloud.so
          nm -D --defined-only app/src/main/jniLibs/arm64-v8a/libresolver.so 2>/dev/null | grep -q JNI_OnLoad
          nm -D --defined-only app/src/main/jniLibs/arm64-v8a/libcloud.so 2>/dev/null | grep -q JNI_OnLoad

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > keystore.jks
          ls -la keystore.jks

      - name: Derive expected signing certificate SHA256
        id: sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore keystore.jks \
            -alias "${ANDROID_KEY_ALIAS}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -file signing.der 2>/dev/null
          SHA=$(openssl dgst -sha256 -hex signing.der | awk '{print $2}')
          echo "signature_sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "derived sha256=${SHA}"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNATURE_SHA256: ${{ steps.sign.outputs.signature_sha256 }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify artifacts
        run: |
          ls -la app/build/outputs/apk/release/
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          SHA_SHORT=${GITHUB_SHA::11}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Fe ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
