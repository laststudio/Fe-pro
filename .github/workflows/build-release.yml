name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fe-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SO_REPO: laststudio/ets_resolver
  PUBLIC_RELEASE_REPOSITORY: laststudio/Fuck_ets100

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify or download resolver/cloud SOs
        env:
          SO_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libresolver.so ] || [ ! -f app/src/main/jniLibs/arm64-v8a/libcloud.so ]; then
            test -n "${SO_TOKEN}" || { echo "缺少 PUBLIC_RELEASE_TOKEN 用于读取 ets_resolver"; exit 1; }
            GH_TOKEN="${SO_TOKEN}" gh release download \
              --repo "${SO_REPO}" \
              --pattern 'libresolver.so' \
              --pattern 'libcloud.so' \
              --dir app/src/main/jniLibs/arm64-v8a \
              --clobber
          else
            echo "Using repository bundled libresolver.so and libcloud.so"
          fi
          file app/src/main/jniLibs/arm64-v8a/libresolver.so app/src/main/jniLibs/arm64-v8a/libcloud.so | grep -q 'ELF 64-bit LSB shared object'
          sha256sum app/src/main/jniLibs/arm64-v8a/libresolver.so app/src/main/jniLibs/arm64-v8a/libcloud.so
          readelf -s app/src/main/jniLibs/arm64-v8a/libresolver.so 2>/dev/null | grep -q JNI_OnLoad || nm -D --defined-only app/src/main/jniLibs/arm64-v8a/libresolver.so 2>/dev/null | grep -q JNI_OnLoad
          readelf -s app/src/main/jniLibs/arm64-v8a/libcloud.so 2>/dev/null | grep -q JNI_OnLoad || nm -D --defined-only app/src/main/jniLibs/arm64-v8a/libcloud.so 2>/dev/null | grep -q JNI_OnLoad

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > keystore.jks
          ls -la keystore.jks

      - name: Derive expected signing certificate SHA256
        id: sign
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore keystore.jks \
            -alias "${ANDROID_KEY_ALIAS}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -file signing.der 2>/dev/null
          SHA=$(openssl dgst -sha256 -hex signing.der | awk '{print $2}')
          echo "signature_sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "derived sha256=${SHA}"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNATURE_SHA256: ${{ steps.sign.outputs.signature_sha256 }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify artifacts
        run: |
          ls -la app/build/outputs/apk/release/
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          SHA_SHORT=${GITHUB_SHA::11}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ci_tag=v${VERSION}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "public_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=Fe_${VERSION}.apk" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Fe_${VERSION}.apk"

      - name: Publish CI Build to Fe-pro
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.ci_tag }}
          name: "Fe ${{ steps.meta.outputs.ci_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/${{ steps.meta.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate public release notes
        run: |
          set -euo pipefail
          python scripts/release/extract_changelog.py \
            --version "${{ steps.meta.outputs.version }}" \
            --apk-url "https://oplist.lastudio.cc/Fe_release" \
            --release-notes release_notes.md

      - name: Publish Official Release to Fuck_ets100
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.public_tag }}"
          APK="release/${{ steps.meta.outputs.apk_name }}"
          if gh release view "${TAG}" --repo "${PUBLIC_RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${PUBLIC_RELEASE_REPOSITORY}, updating notes and asset..."
            gh release edit "${TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --title "Fe ${TAG}" \
              --notes-file release_notes.md \
              --latest
            gh release upload "${TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --clobber \
              "${APK}"
          else
            echo "Creating new release ${TAG} in ${PUBLIC_RELEASE_REPOSITORY}..."
            gh release create "${TAG}" \
              --repo "${PUBLIC_RELEASE_REPOSITORY}" \
              --target public \
              --title "Fe ${TAG}" \
              --notes-file release_notes.md \
              --latest \
              "${APK}"
          fi

      - name: Install LanZou dependencies
        run: python -m pip install --upgrade requests requests-toolbelt

      - name: Upload APK to LanZouCloud
        env:
          LANZOU_USERNAME: ${{ secrets.LANZOU_USERNAME }}
          LANZOU_PASSWORD: ${{ secrets.LANZOU_PASSWORD }}
          LANZOU_FOLDER_NAME: ${{ vars.LANZOU_FOLDER_NAME || 'fe' }}
        run: |
          set -euo pipefail
          python scripts/release/upload_lanzou.py \
            --file "release/${{ steps.meta.outputs.apk_name }}" \
            --folder-name "${LANZOU_FOLDER_NAME}"
